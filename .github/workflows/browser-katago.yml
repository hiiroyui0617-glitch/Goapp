name: Bundle browser KataGo into Goapp
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/browser-katago.yml'
permissions:
  contents: write
concurrency:
  group: katago-browser-bundle
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch open-source web KataGo integration
        run: |
          git clone --depth 1 https://github.com/Sir-Teo/web-katrain.git /tmp/web-katrain
      - name: Build offline-capable KataGo browser UI
        working-directory: /tmp/web-katrain
        env:
          VITE_BASE_URL: /Goapp/katago/
        run: |
          npm ci
          npm run build
      - name: Preserve upstream license and publish build
        run: |
          rm -rf katago
          mkdir -p katago
          cp -R /tmp/web-katrain/dist/. katago/
          cp /tmp/web-katrain/LICENSE katago/UPSTREAM_LICENSE
          printf 'Based on https://github.com/Sir-Teo/web-katrain (MIT License).\nBundled KataGo browser analysis UI.\n' > katago/ATTRIBUTION.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          index = Path("katago/index.html")
          content = index.read_text(encoding="utf-8")
          back = '<a href="../" style="position:fixed;z-index:2147483647;right:8px;bottom:8px;padding:7px 12px;border-radius:8px;background:#1a3346;color:white;font:600 13px sans-serif;box-shadow:0 2px 9px #0007;text-decoration:none;">囲碁アプリに戻る</a>'
          if "</body>" in content: index.write_text(content.replace("</body>",back+"</body>"),encoding="utf-8")
          PY
          git add katago
          if ! git diff --cached --quiet; then
            git commit -m "feat: bundle MIT web KataGo browser mode"
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 4 ]; then exit 1; fi
              sleep 3
            done
          fi
